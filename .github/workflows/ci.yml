name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Darumen.slnx
      - run: dotnet build Darumen.slnx -c Release --no-restore --nologo
      - run: dotnet test Darumen.slnx -c Release --no-build --nologo

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv ml/.venv --python 3.12
      - run: uv pip install --python ml/.venv/bin/python -e "ml[dev]"
      - run: make proto
      - run: ml/.venv/bin/python -m ruff check ml
      - run: ml/.venv/bin/python -m pytest ml/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --run
