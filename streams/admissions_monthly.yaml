stream: admissions_monthly
title: Госпитализации по региону и профилю, по месяцам, из списка пролеченных с 2012 года
from: silver.ersb_cases
entity: [region_kato, profile_code]
time: { column: p_outdate, grain: month }
measure: { agg: count }
peer_group: [profile_code]
forecast: { horizons: [1, 2, 3], min_history_months: 36 }
anomaly: { method: robust_z, window_months: 12, threshold: 3.0 }
