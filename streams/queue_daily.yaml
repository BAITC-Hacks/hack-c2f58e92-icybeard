stream: queue_daily
title: Регистрация направлений (поток в очередь на госпитализацию), по организациям, по дням
from: gold.queue_daily
gold: { table: queue_daily, time: day, y: registered }
entity: [region_kato, mo_code, profile_code]
time: { column: day, grain: day }
