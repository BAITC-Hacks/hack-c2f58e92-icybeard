dataset: onco_ext
title: Информация по онкологическим больным (расширенный)
source:
  system: ЭРОБ
  publisher: МЗ РК
  portal_id: magda-ds-69b7691f-8bae-4cf9-9076-4392e7fcd392
format:
  type: csv
  encoding: utf-8-sig
  delimiter: ","
  quote: '"'
  escape: '"'
grain: один пациент на учёте онкодиспансера
keys: [_row_hash]
signature:
  - clinic_name
  - age
  - number_card
  - take_in_date
  - take_of_date
  - diagnosis_code
  - diagnosis_date
  - deregistration_cause
  - death_cause
  - death_date
  - death_place
  - social_position
  - circumstances
  - clinic_group_at_registration
  - clinic_group_end_of_year
  - cancer_circumstances
  - invalidnost
  - tumor_localization
  - morphology_type
  - morphology_code
  - tumor_stage
  - t
  - n
  - m
  - metastases_localization
  - confirmation_method
  - late_diagnosis_cause
  - last_inspection_date
  - tumor_status
  - patient_state
  - status_on_end_year
  - sdu_load_date
columns:
  clinic_name: { type: string, semantic: mo_name, resolve: refdata.mo_registry, nullable: true }
  age: { type: int, nullable: true }
  number_card: { type: string, drop: true, note: "номер карты: остаётся только в bronze" }
  take_in_date: { type: timestamp, nullable: true }
  take_of_date: { type: timestamp, nullable: true }
  diagnosis_code: { type: string, semantic: icd10, nullable: true }
  diagnosis_date: { type: timestamp, nullable: true }
  deregistration_cause: { type: string, nullable: true }
  death_cause: { type: string, nullable: true }
  death_date: { type: date, nullable: true }
  death_place: { type: string, nullable: true }
  social_position: { type: string, nullable: true }
  circumstances: { type: string, nullable: true }
  clinic_group_at_registration: { type: string, nullable: true }
  clinic_group_end_of_year: { type: string, nullable: true }
  cancer_circumstances: { type: string, nullable: true }
  invalidnost: { type: string, nullable: true }
  tumor_localization: { type: string, nullable: true }
  morphology_type: { type: string, nullable: true }
  morphology_code: { type: string, nullable: true }
  tumor_stage: { type: string, nullable: true }
  t: { type: string, nullable: true }
  n: { type: string, nullable: true }
  m: { type: string, nullable: true }
  metastases_localization: { type: string, nullable: true }
  confirmation_method: { type: string, nullable: true }
  late_diagnosis_cause: { type: string, nullable: true }
  last_inspection_date: { type: timestamp, nullable: true }
  tumor_status: { type: string, nullable: true }
  patient_state: { type: string, nullable: true }
  status_on_end_year: { type: string, nullable: true }
  sdu_load_date: { type: timestamp, semantic: technical }
derive:
  is_late_stage: "tumor_stage in ('3', '4', 'III', 'IV')"
privacy:
  class: sensitive
  direct_identifiers: [number_card]
  public_aggregates_min_count: 10
rules:
  - { level: quarantine, reason: implausible_age, check: "age is null or age between 0 and 120" }
partition: ["year(diagnosis_date)"]
