# Стандарт организации оказания медицинской помощи в стационарных условиях в Республике Казахстан
# (приказ МЗ РК от 24.03.2022 № ҚР-ДСМ-27, в редакции приказа от 15.09.2025 № 94) — только логистика маршрута
# плановой госпитализации: стадии, нормативные сроки, общий перечень обследований с давностью (приложение 5,
# ред. 17.02.2025 № 9), допустимые причины отказа. Медицинских рекомендаций здесь нет (ТЗ §10.2, §11):
# сроки давности анализов — административный норматив, а не совет пациенту. Ориентир по ожиданию —
# из расширенной коллегии МЗ РК 19.02.2026. Публикуется make publish в refdata.route_* (см. lakehouse/publish.py).
meta:
  source: "Стандарт организации оказания медицинской помощи в стационарных условиях в РК, приказ МЗ РК от 24.03.2022 № ҚР-ДСМ-27 (ред. от 15.09.2025 № 94)"
  source_url: "https://adilet.zan.kz/rus/docs/V2200027218"
  source_date: "2025-09-15"
  note: "только логистика маршрута; медицинские рекомендации не даются (ТЗ §10.2, §11)"

# Стадии маршрута: stage_order — порядок на таймлайне; hospitalized и refused — два исхода одной последней стадии.
stages:
  - code: referral_issued
    stage_order: 1
    title_ru: "Направление выдано"
    title_kk: "Жолдама берілді"
    norm_ru: "Организация ПМСП выдаёт направление на плановую госпитализацию: госуслуга, 1 рабочий день"
    norm_kk: "МСАК ұйымы жоспарлы емдеуге жатқызуға жолдама береді: мемлекеттік қызмет, 1 жұмыс күні"
  - code: examination
    stage_order: 2
    title_ru: "Обследование"
    title_kk: "Тексеру"
    norm_ru: "Направляющая организация проводит исследования по приложению 5; сроки давности — в чек-листе"
    norm_kk: "Жолдама берген ұйым 5-қосымша бойынша зерттеулер жүргізеді; жарамдылық мерзімі — тексеру тізімінде"
  - code: waitlisted
    stage_order: 3
    title_ru: "Внесено в лист ожидания"
    title_kk: "Күту парағына енгізілді"
    norm_ru: "Ответственный специалист ПМСП регистрирует направление в Портале бюро госпитализации и отслеживает его ежедневно"
    norm_kk: "МСАК жауапты маманы жолдаманы Емдеуге жатқызу бюросының порталында тіркеп, күн сайын қадағалайды"
  - code: date_assigned
    stage_order: 4
    title_ru: "Дата госпитализации назначена"
    title_kk: "Емдеуге жатқызу күні белгіленді"
    norm_ru: "Планируемая дата определяется в течение 2 рабочих дней после регистрации; перенос по просьбе пациента — не более чем на 2 календарных дня"
    norm_kk: "Жоспарланған күн тіркелгеннен кейін 2 жұмыс күні ішінде белгіленеді; пациенттің өтініші бойынша ауыстыру — 2 күнтізбелік күннен аспайды"
    norm_working_days: 2
    reschedule_max_days: 2
  - code: hospitalized
    stage_order: 5
    title_ru: "Госпитализация"
    title_kk: "Емдеуге жатқызу"
    norm_ru: "Приём через приёмное отделение стационара в назначенную дату"
    norm_kk: "Белгіленген күні стационардың қабылдау бөлімі арқылы қабылдау"
  - code: refused
    stage_order: 5
    title_ru: "Отказ в госпитализации"
    title_kk: "Емдеуге жатқызудан бас тарту"
    norm_ru: "Только по причинам из Стандарта; неявка в течение 2 календарных дней снимает направление с листа ожидания"
    norm_kk: "Тек Стандарттағы себептер бойынша; 2 күнтізбелік күн ішінде келмеу жолдаманы күту парағынан шығарады"
    no_show_days: 2

# Допустимые основания снятия с листа ожидания стационаром (п. 42 Стандарта). В открытых данных ИС БГ причины
# отказов отсутствуют (запрос 6 в docs/data-requests.md) — синтетическим пациентам причина не приписывается.
refusal_reasons:
  - code: no_indications
    title_ru: "Отсутствие показаний к госпитализации"
    title_kk: "Емдеуге жатқызуға көрсеткіштердің болмауы"
  - code: contraindications
    title_ru: "Противопоказания на момент госпитализации"
    title_kk: "Емдеуге жатқызу кезіндегі қарсы көрсеткіштер"
  - code: no_show_2_days
    title_ru: "Неявка в течение 2 календарных дней"
    title_kk: "2 күнтізбелік күн ішінде келмеу"
  - code: non_core_profile
    title_ru: "Непрофильная госпитализация"
    title_kk: "Бейінге сәйкес емес емдеуге жатқызу"

# Общий перечень обследований перед плановой госпитализацией (приложение 5, ред. 17.02.2025 № 9) и срок его
# действия в днях. Профильные исследования назначает направляющий врач — их в чек-листе нет.
checklist:
  - code: cbc
    title_ru: "Общий анализ крови"
    title_kk: "Жалпы қан талдауы"
    validity_days: 14
    validity_label_ru: "14 дней"
    validity_label_kk: "14 күн"
  - code: urinalysis
    title_ru: "Общий анализ мочи"
    title_kk: "Жалпы зәр талдауы"
    validity_days: 14
    validity_label_ru: "14 дней"
    validity_label_kk: "14 күн"
  - code: biochemistry
    title_ru: "Биохимия крови (креатинин, общий белок, АЛТ, АСТ)"
    title_kk: "Қан биохимиясы (креатинин, жалпы ақуыз, АЛТ, АСТ)"
    validity_days: 14
    validity_label_ru: "14 дней"
    validity_label_kk: "14 күн"
  - code: coagulogram
    title_ru: "Коагулограмма"
    title_kk: "Коагулограмма"
    validity_days: 14
    validity_label_ru: "14 дней"
    validity_label_kk: "14 күн"
  - code: ecg
    title_ru: "ЭКГ"
    title_kk: "ЭКГ"
    validity_days: 14
    validity_label_ru: "14 дней"
    validity_label_kk: "14 күн"
  - code: therapist_consultation
    title_ru: "Консультация терапевта"
    title_kk: "Терапевт кеңесі"
    validity_days: 14
    validity_label_ru: "14 дней"
    validity_label_kk: "14 күн"
  - code: syphilis_microreaction
    title_ru: "Микрореакция на сифилис"
    title_kk: "Мерезге микрореакция"
    validity_days: 30
    validity_label_ru: "1 месяц"
    validity_label_kk: "1 ай"
  - code: hiv
    title_ru: "Анализ на ВИЧ"
    title_kk: "АИТВ талдауы"
    validity_days: 180
    validity_label_ru: "6 месяцев"
    validity_label_kk: "6 ай"
  - code: hepatitis_markers
    title_ru: "Маркеры гепатитов B и C"
    title_kk: "B және C гепатиттерінің маркерлері"
    validity_days: 180
    validity_label_ru: "6 месяцев"
    validity_label_kk: "6 ай"
  - code: fluorography
    title_ru: "Флюорография"
    title_kk: "Флюорография"
    validity_days: 365
    validity_label_ru: "12 месяцев"
    validity_label_kk: "12 ай"

# Ориентир МЗ РК по ожиданию плановой госпитализации. Предельного срока ожидания в законодательстве нет —
# Стандарт нормирует только 2 рабочих дня на назначение даты; поэтому рядом с прогнозом показывается цель ведомства.
benchmarks:
  - code: moh_avg_wait_days
    value: 30
    unit: days
    title_ru: "Средний срок ожидания плановой госпитализации по стране"
    title_kk: "Ел бойынша жоспарлы емдеуге жатқызуды күтудің орташа мерзімі"
    source: "МЗ РК, расширенная коллегия 19.02.2026 (kapital.kz/gosudarstvo/145156)"
    source_date: "2026-02-19"
  - code: moh_target_wait_days
    value: 20
    unit: days
    title_ru: "Целевой срок ожидания (МЗ РК)"
    title_kk: "Мақсатты күту мерзімі (ҚР ДСМ)"
    source: "МЗ РК, расширенная коллегия 19.02.2026 (kapital.kz/gosudarstvo/145156)"
    source_date: "2026-02-19"
  - code: moh_share_over_20_days
    value: 0.17
    unit: share
    title_ru: "Доля плановых пациентов, ожидающих дольше 20 дней"
    title_kk: "20 күннен артық күтетін жоспарлы пациенттердің үлесі"
    source: "МЗ РК, расширенная коллегия 19.02.2026 (kapital.kz/gosudarstvo/145156)"
    source_date: "2026-02-19"
