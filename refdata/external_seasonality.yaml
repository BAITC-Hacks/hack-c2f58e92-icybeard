# Сезонные формы из открытых данных NHS England — внешний ориентир для месяцев,
# которые казахстанские данные не покрывают (ИС БГ — только I квартал 2025, приёмные покои — 90 дней).
# Правило (docs/system-structure.md §4): берём ФОРМУ сезона, не уровень; не метки обучения;
# каждое использование в интерфейсе подписано «внешний ориентир, NHS, 2017–2019».
#
# Расчёт: окно 2017-01..2019-12 (до ковида), среднее по календарному месяцу,
# нормировка на среднее = 1. Потоковые ряды (госпитализации, обращения) сначала делятся
# на число дней месяца, лист ожидания — уровень, без нормировки на дни.

meta:
  window: "2017-01..2019-12"
  computed: "2026-09-13"
  note: "форма сезонности другой системы здравоохранения; уровень не переносится"

