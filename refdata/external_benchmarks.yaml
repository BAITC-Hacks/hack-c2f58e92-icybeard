# Внешние ориентиры из аккредитованных источников других стран.
# Правило использования (docs/system-structure.md §4): эти числа НЕ становятся метками обучения
# на казахстанских рядах. Они применяются как пороги, шкалы и проверка разумности, и каждое
# число в интерфейсе подписано источником и годом («внешний ориентир»).

elective_wait_thresholds:
  # Абсолютная шкала для индекса доступности: с чем сравнивать p90 ожидания региона.
  nhs_rtt_standard_days:
    value: 126
    unit: days
    share: 0.92
    source: "NHS England, Referral to Treatment (RTT) standard: 92 % пациентов до 18 недель"
    year: 2024
    usage: "порог «в пределах международной нормы» для p90 ожидания"
  cihi_cataract_target_days:
    value: 112
    unit: days
    share: 0.90
    source: "CIHI (Канада), Wait times for priority procedures: 90 % катаракт за 112 дней"
    year: 2023
    usage: "порог для плановых профилей с сопоставимым определением начала ожидания"
  kz_moh_target_wait_days:
    # Внутренний ориентир, а не внешний: цель ведомства по среднему сроку ожидания плановой госпитализации.
    # Предельного срока ожидания в законодательстве РК нет (Стандарт нормирует только 2 рабочих дня на назначение даты).
    value: 20
    unit: days
    source: "МЗ РК, расширенная коллегия 19.02.2026: средний срок ожидания 30 дней, цель 20 дней, 17 % плановых ждут дольше 20 дней (kapital.kz/gosudarstvo/145156)"
    year: 2026
    usage: "ориентир рядом с NHS/CIHI на страницах региона и ожидания; на маршруте пациента — из refdata/route_standard.yaml"

diagnostics:
  dm01_tests_per_admission:
    value: 1.5
    unit: "исследований DM01 на госпитализацию"
    source: "производная: NHS England DM01 (≈26 млн исследований/год, 15 видов) к ≈17 млн госпитализаций/год"
    year: 2024
    usage: "оценка нагрузки на диагностику региона из прогноза госпитализаций, пока ЕИП не выдан; подписывать «оценка»"

beds:
  eu_beds_per_1000:
    value: 5.3
    unit: "коек на 1 000 жителей"
    source: "Eurostat hlth_rs_bds, средняя по ЕС"
    year: 2021
    usage: "диапазон для сценариев симулятора «что если добавить койки», не норматив"
  kz_beds_per_1000:
    value: 6.0
    unit: "коек на 1 000 жителей"
    source: "ВОЗ European Health for All (Казахстан)"
    year: 2021
    usage: "проверка разумности: суммарные мощности сценария не выходят за уровень страны"

sanity:
  # Тест разумности прогноза (make eval): годовая сумма прогноза госпитализаций на 100 жителей
  # должна оставаться в правдоподобном коридоре вокруг уровней страны по ВОЗ HFA.
  kz_admissions_per_100:
    value_range: [12, 17]
    unit: "госпитализаций на 100 жителей в год"
    source: "ВОЗ European Health for All (HFA), In-patient care discharges per 100, Казахстан, 2014–2020"
    year: 2020
    usage: "справочный уровень страны; сам тест использует широкий коридор ниже"
  sanity_corridor_per_100:
    value_range: [6, 30]
    unit: "госпитализаций на 100 жителей в год"
    source: "производная от уровней ВОЗ HFA по Европейскому региону (широкий коридор ×2)"
    year: 2020
    usage: "make eval падает, если аннуализированный прогноз выходит за коридор"

seasonality:
  rtt_shape_note: >
    Форма сезонности листа ожидания берётся из NHS England RTT monthly (с 2007 года по
    специальностям) при дообучении на пилоте: летний квартал у нас не наблюдён. До загрузки
    официального CSV множители не применяются — прогнозы вне I квартала подписываются
    «сезонность не наблюдалась».
