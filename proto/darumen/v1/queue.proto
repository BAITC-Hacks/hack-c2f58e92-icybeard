syntax = "proto3";

package darumen.v1;

option csharp_namespace = "Darumen.Contracts.V1";

import "darumen/v1/common.proto";

// Queue Intelligence: ожидание плановой госпитализации, риск отказа, альтернативы.
service QueueIntelligence {
  rpc PredictWait(PredictWaitRequest) returns (PredictWaitResponse);
  rpc PredictRefusal(PredictWaitRequest) returns (PredictRefusalResponse);
  rpc Alternatives(AlternativesRequest) returns (AlternativesResponse);
  // Пакетный прогноз для рабочего списка: одна строка на очередь (организация × профиль) региона, без объяснений —
  // объяснение по одной очереди даёт PredictWait. Один вызов вместо двух на каждую из сотен очередей региона.
  rpc PredictQueues(PredictQueuesRequest) returns (PredictQueuesResponse);
}

message QueueRef {
  string mo_code = 1;
  string profile_code = 2;
}

message PredictQueuesRequest {
  RegionRef region = 1;
  repeated QueueRef queues = 2;
  string registration_date = 3; // YYYY-MM-DD, дата среза витрины: модель не видит календарь за пределами обучения
}

message QueueForecast {
  QueueRef queue = 1;
  double p50_days = 2;
  double p90_days = 3;
  double p_within_30_days = 4;
  double p_refusal = 5;
  bool org_in_training = 6;
  string error = 7; // непустая строка — очередь не распознана моделью (профиль или организация), прогноза нет
}

message PredictQueuesResponse {
  repeated QueueForecast forecasts = 1;
  ModelInfo model = 2;
}

message PredictWaitRequest {
  RegionRef region = 1;
  string mo_code = 2;
  string profile_code = 3;      // код профиля койки, DH для дневного стационара
  string icd10 = 4;
  string referral_purpose = 5;
  string territorial_type = 6;  // Город или Село
  string finance_source = 7;
  string registration_date = 8; // YYYY-MM-DD, дата постановки в очередь
  string referring_mo_code = 9; // необязательно: направляющая организация, даёт признак same_mo
}

message PredictWaitResponse {
  double p50_days = 1;
  double p90_days = 2;
  double p_within_30_days = 3;
  Explanation explanation = 4;
  ModelInfo model = 5;
}

message PredictRefusalResponse {
  double p_refusal = 1;
  Explanation explanation = 2;
  ModelInfo model = 3;
  bool org_in_training = 4;  // организация была в обучении: false → риск показывать словами, не процентом
}

message AlternativesRequest {
  PredictWaitRequest base = 1;
  int32 limit = 2;
  double max_distance_km = 3; // 0 означает без ограничения
  bool include_neighbors = 4; // 3.7: искать и в регионах, смежных base.region (refdata/regions.yaml neighbors)
}

message Alternative {
  OrganizationRef organization = 1;
  double p50_days = 2;
  double p90_days = 3;
  double p_refusal = 4;
  double distance_km = 5;
  bool is_neighbor_region = 6; // true, если organization.region отличается от запрошенного base.region
}

message AlternativesResponse {
  repeated Alternative alternatives = 1;
  ModelInfo model = 2;
}
