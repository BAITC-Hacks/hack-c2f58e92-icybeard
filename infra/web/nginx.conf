server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;   # аудио для скрайба и загрузка датасетов

    # API, OpenAPI и Scalar — на сервис api из compose (тот же origin, CORS не нужен).
    # /api/v1/scribe/* API сам проксирует в сервис scribe через YARP.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;    # стенограмма + черновик у скрайба
    }
    location /openapi/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /scalar   { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /health { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # Хэшированные бандлы Vite неизменяемы — кэшируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback; index.html без кэша, чтобы после редеплоя браузер взял новые хэши
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
