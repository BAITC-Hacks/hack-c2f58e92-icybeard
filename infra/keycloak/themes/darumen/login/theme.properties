# Тема входа Darumen — Палитра C «Белый холст» (design/tokens.json, доски W-Auth-*). Родитель keycloak.v2 даёт
# макросы field.ftl/buttons.ftl/user-profile-commons.ftl; свои страницы: template, login, login-reset-password,
# login-update-password, login-otp, login-config-totp, select-authenticator, info, error, login-page-expired,
# logout-confirm, login-verify-email. PatternFly не подключаем: страницы родителя, которые остались (обновление
# профиля, смена почты и т. п.), получают наши классы через свойства kc* ниже.
parent=keycloak.v2
import=common/keycloak
locales=ru,kk
stylesCommon=
styles=css/darumen.css
# Корень сайта для ссылок «О системе» и «Зарегистрировать организацию», когда у клиента нет baseUrl
dmSiteUrl=${env.DARUMEN_WEB_URL:/}

