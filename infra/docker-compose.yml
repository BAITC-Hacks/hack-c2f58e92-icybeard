name: darumen

services:
  postgres:
    image: imresamu/postgis:17-3.5  # multi-arch build; the official postgis/postgis image has no arm64 manifest
    environment:
      POSTGRES_USER: darumen
      POSTGRES_PASSWORD: darumen
      POSTGRES_DB: darumen
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darumen"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: darumen
      CLICKHOUSE_PASSWORD: darumen
      CLICKHOUSE_DB: darumen
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  cube:
    image: cubejs/cube:latest
    environment:
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_NAME: darumen
      CUBEJS_DB_USER: darumen
      CUBEJS_DB_PASS: darumen
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: dev-secret
    ports: ["4000:4000"]
    volumes:
      - ./cube:/cube/conf
    depends_on: [clickhouse]

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]
    depends_on: [kafka]

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: darumen
      MINIO_ROOT_PASSWORD: darumen123
    ports: ["9002:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # issuer в токенах всегда localhost:8080 (браузер), а служебные адреса (JWKS) отдаются по хосту запроса (api → keycloak)
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8080:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5001:5000"]  # 5000 is taken by AirPlay Receiver on macOS
    volumes:
      - mlflowdata:/mlflow

  models:
    build:
      context: ..
      dockerfile: infra/models.Dockerfile
    volumes:
      - ../lakehouse:/lakehouse:ro
    ports: ["50051:50051"]
    profiles: [app]

  scribe:
    build:
      context: ..
      dockerfile: infra/models.Dockerfile
      args:
        SCRIBE_EXTRAS: "1"
    entrypoint: ["python", "-m", "darumen.scribe", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      DARUMEN_SCRIBE_DIR: /scribe
      DARUMEN_LLM_PROVIDER: ollama
      DARUMEN_LLM_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      DARUMEN_SCRIBE_MODEL: ${OLLAMA_MODEL:-darumen-qwen3.8:27b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - scribedata:/scribe
    ports: ["8010:8010"]
    profiles: [app]

  # Конвейер данных в контейнере: intake → refdata → gold → train → publish. Запуск: make pipeline
  pipeline:
    build:
      context: ..
      dockerfile: infra/models.Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python -m darumen.intake add /datasets --contracts contracts --lakehouse /lakehouse --no-events &&
        python -m darumen.refdata build --lakehouse /lakehouse &&
        python -m darumen.lakehouse build --lakehouse /lakehouse &&
        python -m darumen.models.train --lakehouse /lakehouse --cards /cards &&
        python -m darumen.lakehouse publish --lakehouse /lakehouse
    environment:
      POSTGRES_DSN: host=postgres port=5432 dbname=darumen user=darumen password=darumen
      CLICKHOUSE_URL: http://darumen:darumen@clickhouse:8123/darumen
      MLFLOW_TRACKING_URI: sqlite:////lakehouse/mlflow.db
    volumes:
      - ${DATASETS_DIR:-../DataSets}:/datasets:ro
      - ../lakehouse:/lakehouse
      - ../docs/model-cards:/cards
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_started }
    profiles: [pipeline]

  # Ollama в контейнере только для Linux с NVIDIA (профиль ollama); на macOS Docker не видит GPU,
  # поэтому Ollama остаётся приложением на хосте, а контейнеры ходят в host.docker.internal
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
      - ./ollama:/modelfiles:ro
    ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: [ollama]

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/web.Dockerfile
      args:
        VITE_AUTH_MODE: ${WEB_AUTH_MODE:-keycloak}
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_started }
    profiles: [app]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8000
      ConnectionStrings__Postgres: Host=postgres;Database=darumen;Username=darumen;Password=darumen
      ConnectionStrings__ClickHouse: Host=clickhouse;Port=8123;Database=darumen;Username=darumen;Password=darumen
      Messaging__BootstrapServers: kafka:9092
      Messaging__SchemaRegistry: http://schema-registry:8081
      ModelServices__Address: http://models:50051
      Auth__Mode: ${API_AUTH_MODE:-keycloak}
      Auth__Authority: http://keycloak:8080/realms/darumen
      ReverseProxy__Clusters__scribe__Destinations__local__Address: http://scribe:8010/
      Insight__Provider: ollama
      Insight__BaseUrl: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      Insight__Model: ${OLLAMA_MODEL:-darumen-qwen3.8:27b}
      Cors__Origins__0: http://localhost:3000
      Cors__Origins__1: http://localhost:5173
      Quality__LakehouseDir: /lakehouse
    volumes:
      - ../lakehouse:/lakehouse:ro   # отчёты моделей для /analytics/quality
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      schema-registry: { condition: service_started }
      keycloak: { condition: service_started }
      models: { condition: service_started }
      scribe: { condition: service_started }
    profiles: [app]

volumes:
  scribedata:
  ollamadata:
  pgdata:
  chdata:
  miniodata:
  mlflowdata:
