# Синтетические сценарии приёма для оценки AI-скрайба: 10 русских и 10 казахских.
# transcript — эталонная стенограмма (что говорит врач на приёме);
# expect — ключевые факты, которые обязаны попасть в черновик записи (проверка «без правок»).
# Аудио для WER записывается командой по этим текстам: audio/<id>.wav (см. scripts/scribe_eval.py --audio-dir).
# Все пациенты вымышленные, персональных данных нет.

scenarios:
  - id: ru01
    language: ru
    transcript: >
      Пациент жалуется на боль в груди при физической нагрузке в течение двух недель.
      Давление сто пятьдесят на девяносто пять. Диагноз: артериальная гипертензия второй степени.
      Назначаю амлодипин пять миллиграммов утром, контроль давления две недели, повторный приём через месяц.
    expect:
      complaints: ["боль в груди", "нагрузке"]
      diagnosis: ["гипертензия"]
      plan: ["амлодипин", "5", "месяц"]
  - id: ru02
    language: ru
    transcript: >
      Жалобы на сухой кашель три недели, ночная потливость, температура тридцать семь и пять.
      Аускультативно хрипов нет. Направляю на флюорографию и общий анализ крови.
      Предварительно: затяжной бронхит, исключить туберкулёз.
    expect:
      complaints: ["кашель", "потливость"]
      diagnosis: ["бронхит"]
      plan: ["флюорографию|флюорографи", "анализ крови"]
  - id: ru03
    language: ru
    transcript: >
      Пациентка шестидесяти лет с сахарным диабетом второго типа. Гликированный гемоглобин восемь и два процента.
      Жалуется на онемение стоп. Увеличиваю метформин до тысячи миллиграммов дважды в день,
      направляю к неврологу и на осмотр глазного дна.
    expect:
      complaints: ["онемение"]
      diagnosis: ["диабет"]
      plan: ["метформин", "1000", "неврологу"]
  - id: ru04
    language: ru
    transcript: >
      Ребёнок семи лет, боль в горле два дня, температура тридцать восемь и три, налёты на миндалинах.
      Экспресс-тест на стрептококк положительный. Диагноз: острый стрептококковый тонзиллит.
      Назначаю амоксициллин суспензию на десять дней, обильное питьё, контроль через три дня.
    expect:
      complaints: ["горле", "температура"]
      diagnosis: ["тонзиллит"]
      plan: ["амоксициллин", "десять дней|10 дней"]
  - id: ru05
    language: ru
    transcript: >
      Жалобы на боль в пояснице после подъёма тяжести, без иррадиации в ногу, тазовых нарушений нет.
      Симптом Ласега отрицательный. Диагноз: люмбаго. Назначаю ибупрофен четыреста миллиграммов
      три раза в день после еды пять дней, покой не нужен, сохранять активность по самочувствию.
    expect:
      complaints: ["пояснице"]
      diagnosis: ["люмбаго"]
      plan: ["ибупрофен", "400"]
  - id: ru06
    language: ru
    transcript: >
      Пациент сорока пяти лет, изжога и отрыжка кислым после еды в течение месяца, ночью усиливается.
      Красных флагов нет, вес стабильный. Предварительный диагноз: гастроэзофагеальная рефлюксная болезнь.
      Назначаю омепразол двадцать миллиграммов утром натощак четыре недели и направляю на фиброгастроскопию.
    expect:
      complaints: ["изжога"]
      diagnosis: ["рефлюксная"]
      plan: ["омепразол", "фиброгастроскопию"]
  - id: ru07
    language: ru
    transcript: >
      Женщина двадцати восьми лет, планирует беременность. Жалоб нет. Назначаю фолиевую кислоту
      четыреста микрограммов в день, анализы на ВИЧ, гепатиты, краснуху, общий анализ крови,
      осмотр гинеколога. Рекомендую отказ от курения.
    expect:
      complaints: ["планирует беременность"]
      diagnosis: ["осмотр"]
      plan: ["фолиевую|фолиев", "гинеколога"]
  - id: ru08
    language: ru
    transcript: >
      Пациент с бронхиальной астмой, участились ночные приступы до трёх раз в неделю,
      сальбутамолом пользуется почти ежедневно. Пикфлоуметрия снижена. Ступень терапии повышается:
      добавляю будесонид с формотеролом дважды в день, проверить технику ингаляции, явка через две недели.
    expect:
      complaints: ["приступы"]
      diagnosis: ["астм"]
      plan: ["будесонид", "две недели|2 недели"]
  - id: ru09
    language: ru
    transcript: >
      На приёме мужчина шестидесяти пяти лет после перенесённого инфаркта, жалоб нет, давление сто двадцать
      восемьдесят, пульс шестьдесят два. Продолжаем аспирин семьдесят пять миллиграммов, аторвастатин сорок,
      бисопролол два с половиной. Контроль липидограммы через три месяца.
    expect:
      complaints: ["жалоб нет"]
      diagnosis: ["инфаркт"]
      plan: ["аторвастатин", "липидограммы"]
  - id: ru10
    language: ru
    transcript: >
      Девушка девятнадцати лет, высыпания на лице полгода, комедоны и папулы, рубцов нет.
      Диагноз: акне средней степени. Назначаю адапален гель на ночь два месяца, умывание мягким средством,
      при отсутствии эффекта добавим местный антибиотик. Повторный осмотр через восемь недель.
    expect:
      complaints: ["высыпания"]
      diagnosis: ["акне"]
      plan: ["адапален", "восемь недель|8 недель"]
  - id: kk01
    language: kk
    transcript: >
      Науқас екі аптадан бері жүктеме кезінде кеудесінің ауыратынына шағымданады.
      Қысымы жүз елу де тоқсан бес. Диагноз: екінші дәрежелі артериялық гипертензия.
      Таңертең бес миллиграмм амлодипин тағайындаймын, екі апта қысымды бақылау, бір айдан кейін қайта қабылдау.
    expect:
      complaints: ["кеуде", "жүктеме"]
      diagnosis: ["гипертензия"]
      plan: ["амлодипин", "бір ай|1 ай"]
  - id: kk02
    language: kk
    transcript: >
      Шағымдар: үш апта құрғақ жөтел, түнгі терлеу, температура отыз жеті жарым.
      Тыңдағанда сырыл жоқ. Флюорография мен жалпы қан анализіне жіберемін.
      Алдын ала диагноз: созылмалы бронхит, туберкулёзді жоққа шығару керек.
    expect:
      complaints: ["жөтел", "терлеу"]
      diagnosis: ["бронхит"]
      plan: ["флюорография", "қан анализ"]
  - id: kk03
    language: kk
    transcript: >
      Алпыс жастағы науқаста екінші типті қант диабеті. Гликирленген гемоглобин сегіз бүтін оннан екі пайыз.
      Табанының ұюына шағымданады. Метформинді күніне екі рет мың миллиграмға көтеремін,
      неврологқа және көз түбін тексеруге жіберемін.
    expect:
      complaints: ["ұю"]
      diagnosis: ["диабет"]
      plan: ["метформин", "невролог"]
  - id: kk04
    language: kk
    transcript: >
      Жеті жастағы бала, екі күн тамағы ауырады, температура отыз сегіз үш, бадамша бездерінде ақ дақтар.
      Стрептококк экспресс-тесті оң. Диагноз: жедел стрептококкты тонзиллит.
      Он күнге амоксициллин суспензиясын тағайындаймын, көп сұйықтық ішу, үш күннен кейін бақылау.
    expect:
      complaints: ["тамағы"]
      diagnosis: ["тонзиллит"]
      plan: ["амоксициллин", "он күн|10 күн"]
  - id: kk05
    language: kk
    transcript: >
      Ауыр зат көтергеннен кейін белінің ауыратынына шағымданады, аяққа берілмейді.
      Ласег симптомы теріс. Диагноз: люмбаго. Тамақтан кейін күніне үш рет төрт жүз миллиграмм ибупрофен
      бес күнге тағайындаймын, белсенділікті сақтауға кеңес беремін.
    expect:
      complaints: ["бел"]
      diagnosis: ["люмбаго"]
      plan: ["ибупрофен", "төрт жүз|400"]
  - id: kk06
    language: kk
    transcript: >
      Қырық бес жастағы науқас, бір айдан бері тамақтан кейін қыжыл және қышқыл кекірік, түнде күшейеді.
      Қауіпті белгілер жоқ, салмағы тұрақты. Алдын ала диагноз: гастроэзофагеальді рефлюкс ауруы.
      Таңертең ашқарынға жиырма миллиграмм омепразол төрт аптаға, фиброгастроскопияға жіберемін.
    expect:
      complaints: ["қыжыл"]
      diagnosis: ["рефлюкс"]
      plan: ["омепразол", "фиброгастроскопия"]
  - id: kk07
    language: kk
    transcript: >
      Жиырма сегіз жастағы әйел жүктілікті жоспарлап отыр. Шағым жоқ. Күніне төрт жүз микрограмм
      фолий қышқылын тағайындаймын, ВИЧ, гепатиттер, қызамық анализдері, жалпы қан анализі,
      гинеколог қарауы. Темекіден бас тартуға кеңес беремін.
    expect:
      complaints: ["жүктілік"]
      diagnosis: ["қарау"]
      plan: ["фолий", "гинеколог"]
  - id: kk08
    language: kk
    transcript: >
      Бронх демікпесі бар науқаста түнгі ұстамалар аптасына үш ретке дейін жиіледі,
      сальбутамолды күн сайын дерлік қолданады. Пикфлоуметрия төмендеген. Терапия сатысын көтеремін:
      күніне екі рет будесонид пен формотерол қосамын, ингаляция техникасын тексеру, екі аптадан кейін келу.
    expect:
      complaints: ["ұстама"]
      diagnosis: ["демікпе"]
      plan: ["будесонид", "екі апта|2 апта"]
  - id: kk09
    language: kk
    transcript: >
      Қабылдауда алпыс бес жастағы ер адам, инфарктан кейін, шағым жоқ, қысымы жүз жиырма да сексен,
      тамыр соғысы алпыс екі. Аспирин жетпіс бес миллиграмм, аторвастатин қырық, бисопролол екі жарым
      жалғасады. Үш айдан кейін липидограмма бақылауы.
    expect:
      complaints: ["шағым жоқ"]
      diagnosis: ["инфаркт"]
      plan: ["аторвастатин", "липидограмма"]
  - id: kk10
    language: kk
    transcript: >
      Он тоғыз жастағы қыз, жарты жыл бетінде бөртпе, комедондар мен папулалар, тыртық жоқ.
      Диагноз: орташа дәрежелі акне. Түнге адапален гелін екі айға тағайындаймын, жұмсақ жуу құралы,
      нәтиже болмаса жергілікті антибиотик қосамыз. Сегіз аптадан кейін қайта қарау.
    expect:
      complaints: ["бөртпе"]
      diagnosis: ["акне"]
      plan: ["адапален", "сегіз апта|8 апта"]
