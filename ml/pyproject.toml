[project]
name = "darumen"
version = "0.1.0"
description = "Darumen Health: data intake, lakehouse, models and model services"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "pyyaml>=6",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "statsforecast>=2.0",
  "shap>=0.46",
  "ortools>=9.11",
  "mlflow>=2.22",
  "grpcio>=1.66",
  "grpcio-tools>=1.66",
  "grpcio-health-checking>=1.66",
  "grpcio-reflection>=1.66",
  "clickhouse-connect>=0.8",
  "confluent-kafka[protobuf,schemaregistry]>=2.5",
  "protobuf>=5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "dagster>=1.9", "dagster-webserver>=1.9"]
scribe = ["faster-whisper>=1.0", "openai>=1.50", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["src/darumen/v1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
