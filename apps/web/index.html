<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B2A4A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Darumen Health</title>
    <script>
      // Тема до загрузки стилей, чтобы не было вспышки: тот же ключ и класс, что в src/composables/useTheme.ts
      (function () {
        try {
          var choice = localStorage.getItem('darumen.theme');
          var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('darumen-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Заставка до монтирования приложения: знак Darumen собирается (блок → дуга → сектор), main.ts убирает её после mount -->
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 9999; }
      #boot::before { content: ''; position: absolute; inset: 0; background: #0b2a4a; transition: opacity .6s ease; }
      #boot svg, #boot .w { position: relative; }
      #boot.out { pointer-events: none; }
      #boot.out::before, #boot.out .w { opacity: 0; }
      #boot.out:not(.fly) svg { opacity: 0; transition: opacity .5s ease; }
      #boot.fly .l { fill: #0b2a4a; transition: fill .4s ease .3s; }
      :root.darumen-dark #boot.fly .l { fill: #f1f8fb; }
      #boot svg { width: 120px; height: 114px; }
      #boot .w { margin: 0; font: 600 34px/1 Onest, 'Segoe UI', system-ui, sans-serif; letter-spacing: -1.2px; color: #f1f8fb; opacity: 0; transform: translateY(10px); animation: boot-word .6s ease-out 3.1s forwards; transition: opacity .3s ease; }
      #boot .l { transform-origin: 35.5px 50px; animation: boot-block 1.2s cubic-bezier(.2,.9,.3,1.2) both; }
      #boot .a { stroke-dasharray: 40; stroke-dashoffset: 40; animation: boot-arc 1.4s ease-in-out 1s forwards; }
      #boot .f { transform-origin: 48px 50px; transform: scaleX(0); animation: boot-fill 1s cubic-bezier(.2,.8,.2,1) 2.2s forwards; }
      @keyframes boot-block { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
      @keyframes boot-arc { to { stroke-dashoffset: 0 } }
      @keyframes boot-fill { to { transform: scaleX(1) } }
      @keyframes boot-word { to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { #boot .l, #boot .a, #boot .f, #boot .w { animation: none; stroke-dashoffset: 0; transform: none; opacity: 1 } }
    </style>
    <div id="boot" aria-hidden="true">
      <script>document.currentScript.parentElement.dataset.started = String(Date.now())</script>
      <svg viewBox="20 20 63 60" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="boot-c"><rect class="f" x="48" y="50" width="40" height="32"/></clipPath></defs>
        <path class="l" d="M30 22h19v56H30a8 8 0 0 1-8-8V30a8 8 0 0 1 8-8z" fill="#F1F8FB"/>
        <path class="a" d="M53 25a25 25 0 0 1 25 25" fill="none" stroke="#29B6D8" stroke-width="6" stroke-linecap="round"/>
        <path d="M53 50h28a28 28 0 0 1-28 28z" fill="#29B6D8" clip-path="url(#boot-c)"/>
      </svg>
      <p class="w">darumen</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
